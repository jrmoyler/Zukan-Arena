      <rect x="332.04" y="112" width="9" height="9" transform="rotate(75 336.54 116.5)" fill="#f6e2b0" stroke="#0b1020" stroke-width="2.5"/><rect x="412.58" y="251.5" width="9" height="9" transform="rotate(135 417.08 256)" fill="#f6e2b0" stroke="#0b1020" stroke-width="2.5"/><rect x="332.04" y="391" width="9" height="9" transform="rotate(195 336.54 395.5)" fill="#f6e2b0" stroke="#0b1020" stroke-width="2.5"/><rect x="170.96" y="391" width="9" height="9" transform="rotate(255 175.46 395.5)" fill="#f6e2b0" stroke="#0b1020" stroke-width="2.5"/><rect x="90.42" y="251.5" width="9" height="9" transform="rotate(315 94.92 256)" fill="#f6e2b0" stroke="#0b1020" stroke-width="2.5"/><rect x="170.96" y="112" width="9" height="9" transform="rotate(375 175.46 116.5)" fill="#f6e2b0" stroke="#0b1020" stroke-width="2.5"/>
      <!-- monogram -->
      <g filter="url(#lift)">
        <path d="M 192 156 L 332 156 L 344 168 L 344 196 L 232 316 L 344 316 L 344 332 L 320 356 L 180 356 L 168 344 L 168 316 L 280 196 L 168 196 L 168 180 Z" fill="url(#gold)" />
      </g>
      <path d="M 192 156 L 332 156 L 344 168 L 344 171 L 177 171 Z" fill="#fff8e6" fill-opacity=".45"/>
