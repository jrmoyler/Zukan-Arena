<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="Zukan Arena — command 68 living Zukan in an elemental 3D arena battler. Installable, offline-ready." />
    <meta property="og:title" content="Zukan Arena" />
    <meta property="og:description" content="Choose one of 68 Zukan, master six elemental forces and break the Rift." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" sizes="180x180" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zukan Arena" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Zukan Arena" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <title>Zukan Arena</title>
    <style>
      /* Boot splash: painted before any script so the first frame is never blank. */
      html, body { margin: 0; height: 100%; background: #060a14; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center; z-index: 100;
        background: radial-gradient(ellipse at 50% 40%, #18213f 0%, #060a14 70%);
        transition: opacity 0.6s ease, visibility 0.6s;
        font-family: 'Manrope', system-ui, sans-serif; color: #f5f0e6;
      }
      #boot.is-done { opacity: 0; visibility: hidden; }
      #boot .crest { display: block; margin: 0 auto; width: 88px; height: 88px; animation: boot-breathe 2.4s ease-in-out infinite; }
      #boot .label { margin-top: 18px; font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: #e8c27a; text-align: center; }
      #boot .track { width: 180px; height: 2px; margin: 14px auto 0; border-radius: 2px; background: rgba(232, 194, 122, 0.15); overflow: hidden; }
      #boot .fill { width: 0; height: 100%; background: linear-gradient(90deg, #b98a3e, #f8e6b8); transition: width 0.3s ease; }
      @keyframes boot-breathe { 50% { transform: scale(1.05); filter: drop-shadow(0 0 18px rgba(232, 194, 122, 0.45)); } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div>
        <img class="crest" src="/icons/icon.svg" alt="" />
        <div class="label" data-boot-label>Opening the archive</div>
        <div class="track"><div class="fill" data-boot-fill></div></div>
      </div>
    </div>
    <div id="app"></div>
    <noscript>Zukan Arena needs JavaScript and WebGL 2 to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
