name: quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate:manifest
      - run: git diff --exit-code -- public/characters/rig-manifest.json
      - run: npm run verify:characters
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Require all reference characters before merge review
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        run: node scripts/verify-character-assets.mjs --require-approved

